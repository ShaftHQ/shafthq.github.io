name: PR Build Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Security regressions
        run: yarn test:security

      - name: Playwright worktree isolation contract
        run: yarn test:playwright:contract

      - name: Homepage contract
        run: yarn test:homepage

      - name: Type check
        run: yarn typecheck

      - name: Docs contracts
        run: yarn test:docs

      - name: Build
        run: yarn build

      - name: Web performance budgets
        run: yarn test:web-budgets

      - name: Homepage accessibility audit
        run: yarn test:a11y

      - name: Wide table and first-run layout checks
        run: yarn playwright test tests/e2e/wide-tables.spec.js tests/e2e/homepage.spec.js --project=chromium --grep "wide tables|scrollable-region-focusable|tables that fit|first-run strip"

      - name: Project generator cross-browser smoke test
        run: yarn test:project-generator:cross-browser

      - name: Playwright concurrency stability
        run: yarn test:playwright:stability
